# Default values for epinio-application.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This is the API between the epinio server's deployment code, and
# charts implementing the deployment, like this one.

# appName            :: string                 :: application name
# replicaCount       :: integer                :: number of instances (pods) to deploy
# stageID            :: string                 :: id of stage run generating the app image
# imageURL           :: string                 :: reference to app image in registry
# username           :: string                 :: user triggering deployment
# routes             :: sequence (route)       :: routes (= domain+path+id) the app has to be reachable at
# env                :: sequence (assignment)  :: app environment variables and values
# configurations     :: sequence (string)      :: names of the configurations to import into the app
# configpaths        :: sequence (config)      :: names and mount paths of the bound configurations
# start              :: integer                :: time of deployment, nanoseconds
# ingress            :: string                 :: ingress class name to use, if any
##
#  assignment :: map ('name' -> string, 'value' -> string)
#  route      :: map ('id' -> string, 'domain' -> string, 'path' -> string)
#  config     :: map ('name' -> string, 'path' -> string)
#
# The field 'configpaths' is a replacement and extension of field 'configurations', separating a
# configuration's name from from its mounting path in the application container. This allows for
# using a more human-readable path. The server fills both fields so that old(er) charts can still
# work, even if they are unable to take advantage of the nicer paths of the extension.

# The `start` element can be used to force a restart of specific resources with each
# re-deployment. This standard chart uses it in a pod template annotation, forcing pod
# restart.
#
# This is required because an app may have to ingest changes to resources outside of
# itself.  I.e. an update to a bound configuration

image:
  pullPolicy: IfNotPresent

# ignored - image pull secrets work via service account
imagePullSecrets: []

epinio:
  ingress: ~
  appName: placeholder
  # namespace: .Release.Namespace
  replicaCount: 1
  stageID: 999
  imageURL: ~
  username: user
  routes: ~
  env: ~
  configurations: ~
  start: ~

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

userConfig:
  # Optional traefik IngressRoute configuration. Not part of the epinio server
  # API; supplied directly via chart values.
  #
  # `traefik` is a single composite setting whose value is a JSON document
  # mapping domain -> traefik configuration. The reserved "*" key and the
  # "certResolver" field are no longer supported and will cause a render failure
  # if present. All keys and inner fields are optional; omitting a field leaves
  # it at its default value.
  #
  # Default per route:
  #   entryPoint: "internalsecure" if domain ends with ".internal.foss.net.za",
  #               "websecure" otherwise
  #   tlsIssuer:  "step-ca" if domain ends with ".internal.foss.net.za",
  #               "letsencrypt-production" otherwise
  #
  # `tlsOptions` is resolved per domain only (no wildcard fallback);
  # within it, `name` and `namespace` are both optional. A malformed value or a
  # non-object top-level JSON fails the render with a clear message.
  #
  # `middlewares` is resolved per domain only. It is an array of objects, each
  # with `name` (required) and `namespace` (optional). When the resolved
  # entryPoint is "websecure", the middleware {"name":"crowdsec","namespace":"crowdsec"}
  # is automatically prepended unless it is already present in the list.
  #
  # traefik: |
  #   {
  #     "secure.example.com": {
  #       "entryPoint":   "websecure",
  #       "tlsOptions": { "name": "my-tls-option", "namespace": "default" },
  #       "middlewares": [
  #         { "name": "ratelimit", "namespace": "traefik" }
  #       ]
  #     },
  #     "issued.example.com": {
  #       "entryPoint": "websecure",
  #       "tlsIssuer":  "my-cluster-issuer"
  #     }
  #   }
  traefik: "{}"

  # `priorityClassName` is a plain string. When specified (non-empty), the
  # deployment's spec.template.spec.priorityClassName is set to this value.
  #
  priorityClassName: ~
