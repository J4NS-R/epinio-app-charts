{{- $cfg := include "epinio-traefik-config" . | fromJson -}}
{{- range .Values.epinio.routes }}
{{- $ep := include "epinio-route-entrypoint" (list $cfg .domain) -}}
{{- $ti := include "epinio-route-tls-issuer" (list $cfg .domain) -}}
{{- $tlsOpts := include "epinio-route-traefik-tls-options" (list $cfg .domain) | fromJson -}}
{{- $hasTLS := include "epinio-route-has-tls" (list $ep (empty $tlsOpts)) -}}
{{- $mws := list -}}
{{- $dom := index $cfg .domain -}}
{{- if $dom -}}{{- if hasKey $dom "middlewares" -}}{{- $mws = index $dom "middlewares" -}}{{- end -}}{{- end -}}
{{- if eq $ep "websecure" -}}
{{- $hasCrowdsec := false -}}
{{- range $mws -}}{{- if and (eq .name "crowdsec") (eq .namespace "crowdsec") -}}{{- $hasCrowdsec = true -}}{{- end -}}{{- end -}}
{{- if not $hasCrowdsec -}}
{{- $mws = prepend $mws (dict "name" "crowdsec" "namespace" "crowdsec") -}}
{{- end -}}
{{- end -}}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "epinio-truncate" (print $.Values.epinio.appName "-" .id) }}
  namespace: {{ $.Release.Namespace | quote }}
  annotations:
    {{- include "epinio-application.annotations" $ | nindent 4 }}
  labels:
    {{- include "epinio-application.labels" $ | nindent 4 }}
spec:
  {{- with $.Values.epinio.ingress }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  entryPoints:
    - {{ $ep | quote }}
  routes:
  - match: Host(`{{ .domain }}`) && PathPrefix(`{{ .path }}`)
    kind: Rule
    {{- if $mws }}
    middlewares:
    {{- range $mws }}
      - name: {{ .name | quote }}
        {{- if .namespace }}
        namespace: {{ .namespace | quote }}
        {{- end }}
    {{- end }}
    {{- end }}
    services:
    - name: {{ include "epinio-app-service-name" $ }}
      port: 8080
  {{- if $hasTLS }}
  tls:
    secretName: {{ include "epinio-tls-secret-name" (list $.Values.epinio.appName .domain) | quote }}
    {{- if not (empty $tlsOpts) }}
    options:
      {{- with $tlsOpts.name }}
      name: {{ . | quote }}
      {{- end }}
      {{- with $tlsOpts.namespace }}
      namespace: {{ . | quote }}
      {{- end }}
    {{- end }}
  {{- end }}
{{ end }}