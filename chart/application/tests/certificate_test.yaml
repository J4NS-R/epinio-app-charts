suite: certificate tests
templates:
  - templates/certificate.yaml
values:
  - required.yaml
tests:
  - it: given no traefik userConfig then a Certificate should be rendered with the default tlsIssuer
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Certificate
      - isAPIVersion:
          of: cert-manager.io/v1
      - equal:
          path: metadata.name
          value: rmyapp-appexamplecom-t-0862101499cd8ed555acce0ac207778c8bb17499
      - equal:
          path: spec.secretName
          value: rmyapp-appexamplecom-t-0862101499cd8ed555acce0ac207778c8bb17499
      - equal:
          path: spec.dnsNames[0]
          value: app.example.com
      - equal:
          path: spec.issuerRef.name
          value: letsencrypt-production
      - equal:
          path: spec.issuerRef.kind
          value: ClusterIssuer
      - equal:
          path: spec.issuerRef.group
          value: cert-manager.io

  - it: given a domain ending with .internal.foss.net.za then tlsIssuer should default to step-ca
    set:
      epinio.routes:
        - id: r1
          domain: app.internal.foss.net.za
          path: /
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.dnsNames[0]
          value: app.internal.foss.net.za
      - equal:
          path: spec.issuerRef.name
          value: step-ca

  - it: given a per-domain tlsIssuer then it should override the default
    set:
      userConfig.traefik: '{"app.example.com":{"tlsIssuer":"my-cluster-issuer"}}'
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.dnsNames[0]
          value: app.example.com
      - equal:
          path: spec.issuerRef.name
          value: my-cluster-issuer

  - it: given two routes on different domains then one Certificate per domain should be rendered
    set:
      epinio.routes:
        - id: r1
          domain: a.example.com
          path: /
        - id: r2
          domain: b.example.com
          path: /
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: spec.dnsNames[0]
          value: a.example.com
      - documentIndex: 0
        equal:
          path: spec.issuerRef.name
          value: letsencrypt-production
      - documentIndex: 1
        equal:
          path: spec.dnsNames[0]
          value: b.example.com
      - documentIndex: 1
        equal:
          path: spec.issuerRef.name
          value: letsencrypt-production

  - it: given two routes sharing a domain then only one Certificate should be rendered for that domain
    set:
      epinio.routes:
        - id: r1
          domain: same.example.com
          path: /
        - id: r2
          domain: same.example.com
          path: /api
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.dnsNames[0]
          value: same.example.com

  - it: given a per-domain tlsIssuer on only one of two routes then both get Certificates but with different issuers
    set:
      epinio.routes:
        - id: r1
          domain: issued.example.com
          path: /
        - id: r2
          domain: plain.example.com
          path: /
      userConfig.traefik: '{"issued.example.com":{"tlsIssuer":"my-issuer"}}'
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: spec.dnsNames[0]
          value: issued.example.com
      - documentIndex: 0
        equal:
          path: spec.issuerRef.name
          value: my-issuer
      - documentIndex: 1
        equal:
          path: spec.dnsNames[0]
          value: plain.example.com
      - documentIndex: 1
        equal:
          path: spec.issuerRef.name
          value: letsencrypt-production

  - it: given a "*" key in traefik config then rendering should fail
    set:
      userConfig.traefik: '{"*":{"entryPoint":"websecure"}}'
    asserts:
      - failedTemplate:
          errorPattern: 'the "\*" wildcard key is no longer supported'

  - it: given a certResolver field in traefik config then rendering should fail
    set:
      userConfig.traefik: '{"app.example.com":{"certResolver":"letsencrypt"}}'
    asserts:
      - failedTemplate:
          errorPattern: '"certResolver" is no longer supported'

  - it: given a mixed internal and external domain then each Certificate gets the correct issuer
    set:
      epinio.routes:
        - id: r1
          domain: app.example.com
          path: /
        - id: r2
          domain: svc.internal.foss.net.za
          path: /
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: spec.issuerRef.name
          value: letsencrypt-production
      - documentIndex: 1
        equal:
          path: spec.issuerRef.name
          value: step-ca

  - it: given a non-secure entryPoint then no Certificate should be rendered
    set:
      epinio.routes:
        - id: r1
          domain: app.example.com
          path: /
      userConfig.traefik: '{"app.example.com":{"entryPoint":"web"}}'
    asserts:
      - hasDocuments:
          count: 0

  - it: given a non-secure entryPoint with tlsOptions then a Certificate should be rendered
    set:
      userConfig.traefik: '{"app.example.com":{"entryPoint":"web","tlsOptions":{"name":"my-opt"}}}'
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.dnsNames[0]
          value: app.example.com
      - equal:
          path: spec.issuerRef.name
          value: letsencrypt-production