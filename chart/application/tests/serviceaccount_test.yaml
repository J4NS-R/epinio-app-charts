suite: serviceaccount tests
templates:
  - templates/serviceaccount.yaml
values:
  - required.yaml
tests:
  - it: given no serviceAccount config then no ServiceAccount should be rendered
    asserts:
      - hasDocuments:
          count: 0

  - it: given serviceAccount disabled then no ServiceAccount should be rendered
    set:
      userConfig.serviceAccount: '{"enabled":false}'
    asserts:
      - hasDocuments:
          count: 0

  - it: given serviceAccount enabled then a ServiceAccount should be rendered
    set:
      userConfig.serviceAccount: '{"enabled":true}'
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: rmyapp-94e7d341f71ff6f43253f1c5e813057b22f91cda
      - equal:
          path: metadata.namespace
          value: NAMESPACE

  - it: given serviceAccount enabled with empty JSON object then no ServiceAccount should be rendered
    set:
      userConfig.serviceAccount: '{}'
    asserts:
      - hasDocuments:
          count: 0

  - it: given a malformed serviceAccount JSON then rendering should fail with a clear message
    set:
      userConfig.serviceAccount: 'not-json'
    asserts:
      - failedTemplate:
          errorPattern: "userConfig\\.serviceAccount is not valid JSON"