suite: ingress route tests
templates:
  - templates/ingress.yaml
values:
  - required.yaml
tests:
  - it: given no traefik userConfig then should render an IngressRoute with default entryPoint websecure, tls block, and crowdsec middleware
    asserts:
      - hasDocuments:
           count: 1
      - isKind:
           of: IngressRoute
      - isAPIVersion:
           of: traefik.io/v1alpha1
      - equal:
           path: spec.entryPoints
           value:
             - websecure
      - equal:
           path: spec.tls.secretName
           value: rmyapp-appexamplecom-t-0862101499cd8ed555acce0ac207778c8bb17499
      - notExists:
           path: spec.tls.options
      - matchRegex:
           path: spec.routes[0].match
           pattern: "^Host\\(`app\\.example\\.com`\\) && PathPrefix\\(`/`\\)$"
      - equal:
           path: spec.routes[0].kind
           value: Rule
      - equal:
           path: spec.routes[0].services[0].port
           value: 8080
      - equal:
           path: spec.routes[0].middlewares[0].name
           value: crowdsec
      - equal:
           path: spec.routes[0].middlewares[0].namespace
           value: crowdsec

  - it: given a custom appListeningPort then the route service port should stay 8080 (Service port)
    set:
      userConfig.appListeningPort: 9000
    asserts:
      - equal:
           path: spec.routes[0].services[0].port
           value: 8080

  - it: given epinio.ingress is set then ingressClassName should be set
    set:
      epinio.ingress: traefik-lb
    asserts:
      - equal:
           path: spec.ingressClassName
           value: traefik-lb

  - it: given no epinio.ingress then ingressClassName should not be present
    asserts:
      - notExists:
           path: spec.ingressClassName

  - it: given a non-secure entryPoint then the tls block should be absent
    set:
      epinio.routes:
        - id: r1
          domain: app.example.com
          path: /
      userConfig.traefik: '{"app.example.com":{"entryPoint":"web"}}'
    asserts:
      - equal:
           path: spec.entryPoints
           value:
             - web
      - notExists:
           path: spec.tls

  - it: given a non-secure entryPoint with middlewares then the tls block should be absent
    set:
      userConfig.traefik: '{"app.example.com":{"entryPoint":"web","middlewares":[{"name":"my-mw","namespace":"default"}]}}'
    asserts:
      - equal:
           path: spec.entryPoints
           value:
             - web
      - notExists:
           path: spec.tls

  - it: given a non-secure entryPoint with tlsOptions then the tls block should be present with tlsOptions only
    set:
      userConfig.traefik: '{"app.example.com":{"entryPoint":"web","tlsOptions":{"name":"my-opt","namespace":"default"}}}'
    asserts:
      - equal:
           path: spec.entryPoints
           value:
             - web
      - equal:
           path: spec.tls.options.name
           value: my-opt
      - equal:
           path: spec.tls.options.namespace
           value: default

  - it: given a domain ending with .internal.foss.net.za then entryPoint should default to internalsecure with tls
    set:
      epinio.routes:
        - id: r1
          domain: app.internal.foss.net.za
          path: /
    asserts:
      - equal:
           path: spec.entryPoints
           value:
             - internalsecure
      - equal:
           path: spec.tls.secretName
           value: rmyapp-appinternalfoss-23f18506cd2805429d2a65dedda3db898f293f8a

  - it: given a per-domain tlsIssuer then it should override the default
    set:
      userConfig.traefik: '{"app.example.com":{"tlsIssuer":"my-cluster-issuer"}}'
    asserts:
      - equal:
           path: spec.tls.secretName
           value: rmyapp-appexamplecom-t-0862101499cd8ed555acce0ac207778c8bb17499

  - it: given a per-domain tlsIssuer with tlsOptions then both should appear in the IngressRoute
    set:
      userConfig.traefik: '{"app.example.com":{"tlsIssuer":"my-issuer","tlsOptions":{"name":"my-opt","namespace":"default"}}}'
    asserts:
      - equal:
           path: spec.tls.secretName
           value: rmyapp-appexamplecom-t-0862101499cd8ed555acce0ac207778c8bb17499
      - equal:
           path: spec.tls.options.name
           value: my-opt
      - equal:
           path: spec.tls.options.namespace
           value: default

  - it: given a per-domain tlsOptions with name and namespace then tls.options should carry both
    set:
      userConfig.traefik: '{"app.example.com":{"tlsOptions":{"name":"my-tls-opt","namespace":"default"}}}'
    asserts:
      - equal:
           path: spec.tls.options.name
           value: my-tls-opt
      - equal:
           path: spec.tls.options.namespace
           value: default

  - it: given a per-domain tlsOptions with only name then tls.options should contain only the name
    set:
      userConfig.traefik: '{"app.example.com":{"tlsOptions":{"name":"my-tls-opt"}}}'
    asserts:
      - equal:
           path: spec.tls.options.name
           value: my-tls-opt
      - notExists:
           path: spec.tls.options.namespace

  - it: given a per-domain tlsOptions with only namespace then tls.options should contain only the namespace
    set:
      userConfig.traefik: '{"app.example.com":{"tlsOptions":{"namespace":"default"}}}'
    asserts:
      - notExists:
           path: spec.tls.options.name
      - equal:
           path: spec.tls.options.namespace
           value: default

  - it: given two routes on different domains then each route should resolve its own per-domain entryPoint
    set:
      epinio.routes:
        - id: r1
          domain: a.example.com
          path: /
        - id: r2
          domain: b.example.com
          path: /
      userConfig.traefik: '{"a.example.com":{"entryPoint":"web"},"b.example.com":{"entryPoint":"internalsecure"}}'
    asserts:
      - hasDocuments:
           count: 2
      - documentIndex: 0
        equal:
           path: spec.entryPoints
           value:
             - web
      - documentIndex: 0
        notExists:
           path: spec.tls
      - documentIndex: 1
        equal:
           path: spec.entryPoints
           value:
             - internalsecure
      - documentIndex: 1
        equal:
           path: spec.tls.secretName
           value: rmyapp-bexamplecom-tls-40ed72b7b27e54f1c9f18c275b70207fc03803a1

  - it: given two routes on the same domain then both should resolve the same per-domain entryPoint
    set:
      epinio.routes:
        - id: r1
          domain: same.example.com
          path: /
        - id: r2
          domain: same.example.com
          path: /api
      userConfig.traefik: '{"same.example.com":{"entryPoint":"websecure"}}'
    asserts:
      - hasDocuments:
           count: 2
      - documentIndex: 0
        equal:
           path: spec.entryPoints
           value:
             - websecure
      - documentIndex: 1
        equal:
           path: spec.entryPoints
           value:
             - websecure

  - it: given an empty traefik object then it should render with defaults
    set:
      userConfig.traefik: '{}'
    asserts:
      - equal:
           path: spec.entryPoints
           value:
             - websecure
      - equal:
           path: spec.tls.secretName
           value: rmyapp-appexamplecom-t-0862101499cd8ed555acce0ac207778c8bb17499

  - it: given a route with a path and domain then the match rule should combine Host and PathPrefix
    set:
      epinio.routes:
        - id: r2
          domain: sub.example.com
          path: /api
    asserts:
      - matchRegex:
           path: spec.routes[0].match
           pattern: "Host\\(`sub\\.example\\.com`\\) && PathPrefix\\(`/api`\\)"

  - it: given multiple routes then one IngressRoute document per route should be rendered
    set:
      epinio.routes:
        - id: r1
          domain: a.example.com
          path: /
        - id: r2
          domain: b.example.com
          path: /v2
    asserts:
      - hasDocuments:
           count: 2

  - it: given a "*" key in traefik config then rendering should fail
    set:
      userConfig.traefik: '{"*":{"entryPoint":"websecure"}}'
    asserts:
      - failedTemplate:
           errorPattern: 'the "\*" wildcard key is no longer supported'

  - it: given a certResolver field in traefik config then rendering should fail
    set:
      userConfig.traefik: '{"app.example.com":{"certResolver":"letsencrypt"}}'
    asserts:
      - failedTemplate:
           errorPattern: '"certResolver" is no longer supported'

  - it: given a malformed traefik JSON then rendering should fail with a clear message
    set:
      userConfig.traefik: 'not-json'
    asserts:
      - failedTemplate:
           errorPattern: "userConfig\\.traefik is not valid JSON"

  - it: given a traefik JSON that is not a top-level object then rendering should fail
    set:
      userConfig.traefik: '["a","b"]'
    asserts:
      - failedTemplate:
           errorPattern: "userConfig\\.traefik is not valid JSON"

  - it: given a mixed internal and external domain then each route gets its own default entryPoint and tlsIssuer
    set:
      epinio.routes:
        - id: r1
          domain: app.example.com
          path: /
        - id: r2
          domain: svc.internal.foss.net.za
          path: /
    asserts:
      - hasDocuments:
           count: 2
      - documentIndex: 0
        equal:
           path: spec.entryPoints
           value:
             - websecure
      - documentIndex: 0
        equal:
           path: spec.tls.secretName
           value: rmyapp-appexamplecom-t-0862101499cd8ed555acce0ac207778c8bb17499
      - documentIndex: 1
        equal:
           path: spec.entryPoints
           value:
             - internalsecure
      - documentIndex: 1
        equal:
           path: spec.tls.secretName
           value: rmyapp-svcinternalfoss-faa340b675eee01963ca713d6a3ba7919c228e0f

  - it: given a websecure entryPoint then the crowdsec middleware should be auto-injected as the first middleware
    set:
      userConfig.traefik: '{"app.example.com":{"middlewares":[{"name":"ratelimit","namespace":"traefik"}]}}'
    asserts:
      - equal:
           path: spec.routes[0].middlewares[0].name
           value: crowdsec
      - equal:
           path: spec.routes[0].middlewares[0].namespace
           value: crowdsec
      - equal:
           path: spec.routes[0].middlewares[1].name
           value: ratelimit
      - equal:
           path: spec.routes[0].middlewares[1].namespace
           value: traefik

  - it: given an internalsecure entryPoint then no crowdsec middleware should be auto-injected
    set:
      epinio.routes:
        - id: r1
          domain: app.internal.foss.net.za
          path: /
    asserts:
      - equal:
           path: spec.entryPoints
           value:
             - internalsecure
      - notExists:
           path: spec.routes[0].middlewares

  - it: given a websecure entryPoint with user middlewares then crowdsec should be prepended
    set:
      userConfig.traefik: '{"app.example.com":{"entryPoint":"websecure","middlewares":[{"name":"my-mw","namespace":"default"}]}}'
    asserts:
      - equal:
           path: spec.routes[0].middlewares[0].name
           value: crowdsec
      - equal:
           path: spec.routes[0].middlewares[0].namespace
           value: crowdsec
      - equal:
           path: spec.routes[0].middlewares[1].name
           value: my-mw
      - equal:
           path: spec.routes[0].middlewares[1].namespace
           value: default

  - it: given a websecure entryPoint where the user already specifies the crowdsec middleware then it should not be duplicated
    set:
      userConfig.traefik: '{"app.example.com":{"entryPoint":"websecure","middlewares":[{"name":"crowdsec","namespace":"crowdsec"}]}}'
    asserts:
      - equal:
           path: spec.routes[0].middlewares
           value:
             - name: crowdsec
               namespace: crowdsec

  - it: given a websecure entryPoint where user specifies crowdsec middleware among others then it should not be duplicated
    set:
      userConfig.traefik: '{"app.example.com":{"entryPoint":"websecure","middlewares":[{"name":"ratelimit","namespace":"traefik"},{"name":"crowdsec","namespace":"crowdsec"}]}}'
    asserts:
      - equal:
           path: spec.routes[0].middlewares[0].name
           value: ratelimit
      - equal:
           path: spec.routes[0].middlewares[1].name
           value: crowdsec
      - lengthEqual:
           path: spec.routes[0].middlewares
           count: 2

  - it: given a non-websecure entryPoint explicitly set then no crowdsec middleware should be auto-injected
    set:
      userConfig.traefik: '{"app.example.com":{"entryPoint":"web","middlewares":[{"name":"my-mw","namespace":"default"}]}}'
    asserts:
      - equal:
           path: spec.entryPoints
           value:
             - web
      - equal:
           path: spec.routes[0].middlewares[0].name
           value: my-mw
      - lengthEqual:
           path: spec.routes[0].middlewares
           count: 1

  - it: given a middleware without namespace then only the name should be rendered
    set:
      userConfig.traefik: '{"app.example.com":{"middlewares":[{"name":"my-mw"}]}}'
    asserts:
      - equal:
           path: spec.routes[0].middlewares[0].name
           value: crowdsec
      - equal:
           path: spec.routes[0].middlewares[0].namespace
           value: crowdsec
      - equal:
           path: spec.routes[0].middlewares[1].name
           value: my-mw
      - notExists:
           path: spec.routes[0].middlewares[1].namespace
