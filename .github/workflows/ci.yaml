name: CI

on:
  push:
    branches: ["main", "*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/chart-testing-action@v2
      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest.git
      - name: Run tests
        run: helm unittest chart/application

  package:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      needs_release: ${{ steps.version.outputs.needs_release }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: mikefarah/yq@v4
      - name: Check version tag & pre-release
        id: version
        run: |
          VERSION=$(yq '.version' < chart/application/Chart.yaml)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "needs_release=false" >> "$GITHUB_OUTPUT"
          else
            BRANCH_NAME="${{ github.ref_name }}"
            if [[ "$BRANCH_NAME" == "main" ]]; then
              if [[ "$VERSION" != *-* ]]; then
                echo "needs_release=true" >> "$GITHUB_OUTPUT"
              else
                echo "needs_release=false" >> "$GITHUB_OUTPUT"
                echo "Skipping final release from main branch for pre-release version $VERSION"
              fi
            else
              if [[ "$VERSION" == *-* ]]; then
                echo "needs_release=true" >> "$GITHUB_OUTPUT"
              else
                echo "needs_release=false" >> "$GITHUB_OUTPUT"
                echo "Skipping pre-release from non-main branch for final version $VERSION"
              fi
            fi
          fi
      - name: Package chart
        if: steps.version.outputs.needs_release == 'true'
        run: helm package chart/application
      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.needs_release == 'true'
        with:
          name: chart-package
          path: epinio-application-traefiked-${{ steps.version.outputs.version }}.tgz

  release:
    needs: package
    if: needs.package.outputs.needs_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chart-package
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.package.outputs.version }}
          prerelease: ${{ needs.package.outputs.prerelease == 'true' }}
          files: epinio-application-traefiked-${{ needs.package.outputs.version }}.tgz
